[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-level-forge-playable"
version = "0.6.3"
description = "Plugin-host AI game level generator with a playable preview runtime."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Level Forge Contributors" }]
keywords = ["level-generation", "procedural", "ai", "game-dev", "plugin-host"]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "rich>=13.7",
    "networkx>=3.2",
]

[project.optional-dependencies]
play = ["pygame-ce>=2.4"]
ml = ["onnxruntime>=1.17"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "black>=24.3",
]

[project.scripts]
levelforge = "levelforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["levelforge*", "forge_plugins*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["levelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"